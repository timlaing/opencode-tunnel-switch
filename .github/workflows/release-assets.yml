name: Release install bundle

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/scripts/build-release.py
      - .github/workflows/release-assets.yml
      - .github/workflows/publish-plugin.yml
      - README.md
      - CONTRIBUTING.md
      - docs/**
      - examples/**
      - deploy/**
      - pyproject.toml
      - src/**
      - plugin/**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag to build and attach
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: python -m pip install build
      - run: npm ci --prefix plugin
      - name: Build explicit release bundle
        run: python .github/scripts/build-release.py "$RUNNER_TEMP/release-assets"
      - name: Check checksum and installed service from the bundle
        run: |
          cd "$RUNNER_TEMP/release-assets"
          sha256sum -c SHA256SUMS
          tar -xzf opencode-tunnel-switch-release.tar.gz
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install opencode-tunnel-switch/service/*.whl
          "$RUNNER_TEMP/release-venv/bin/tunnel-switch" --help
          "$RUNNER_TEMP/release-venv/bin/tunnel-switch" validate --config opencode-tunnel-switch/examples/config.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-install-bundle
          path: |
            ${{ runner.temp }}/release-assets/opencode-tunnel-switch-release.tar.gz
            ${{ runner.temp }}/release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach assets to GitHub release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-install-bundle
          path: release-assets
      - name: Upload verified assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/opencode-tunnel-switch-release.tar.gz release-assets/SHA256SUMS
