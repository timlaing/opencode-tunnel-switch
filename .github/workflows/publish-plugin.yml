name: Publish plugin

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-packages-plugin-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish public npm package
    if: github.repository == 'timlaing/opencode-tunnel-switch' && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'service-v')) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@timlaing'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Check package version and release tag
        working-directory: plugin
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@timlaing/opencode-tunnel-switch' || pkg.private === true || pkg.publishConfig.registry !== 'https://npm.pkg.github.com' || pkg.publishConfig.access !== 'public')
            throw new Error('Unexpected package publishing configuration');
          if (process.env.GITHUB_EVENT_NAME === 'release' && ![`v${pkg.version}`, `plugin-v${pkg.version}`].includes(process.env.RELEASE_TAG))
            throw new Error('Release tag must match the plugin package version');
          JS
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci --ignore-scripts --prefix plugin
      - run: npm run check --prefix plugin
      - run: npm test --prefix plugin
      - run: bun --conditions=browser plugin/scripts/verify-tui.ts
      - name: Pack and verify the installed artifact
        working-directory: plugin
        run: |
          npm pack --json > "$RUNNER_TEMP/plugin-pack.json"
          npm run verify:package < "$RUNNER_TEMP/plugin-pack.json"
      - name: Require a public repository
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')" = public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require public package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub package visibility is managed separately from npm access.
          test "$(gh api users/timlaing/packages/npm/opencode-tunnel-switch --jq '.visibility')" = public
      - name: Publish the tested archive
        working-directory: plugin
        run: npm run publish:package < "$RUNNER_TEMP/plugin-pack.json"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published package
        working-directory: plugin
        run: npm run verify:published < "$RUNNER_TEMP/plugin-pack.json"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
