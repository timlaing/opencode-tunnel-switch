name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Normalize plugin LCOV paths to repository root
        run: sed -i 's|^SF:|SF:plugin/|' coverage/lcov.info
      - name: Upload plugin coverage for SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugin-coverage
          path: plugin/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-14
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Use Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install test and packaging dependencies
        run: python -m pip install -e '.[test]' build
      - name: Install plugin dependencies for Bun integration
        run: npm ci --prefix plugin
      - name: Test service, proxy and real Bun routing
        run: python -m pytest -q --cov=tunnel_switch --cov-branch --cov-report=xml:coverage.xml
        env:
          TUNNEL_SWITCH_TEST_BUN: bun
      - name: Upload Python coverage for SonarQube
        if: runner.os == 'Linux' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Build Python distribution
        run: python -m build
      - name: Verify installed wheel and CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          tunnel-switch --help
          tunnel-switch validate --config examples/config.yaml

  deployment:
    name: Deployment unit syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify systemd unit without starting a service
        run: |
          # The CLI is installed at deployment time; this executable placeholder
          # lets verify check the unit's syntax and dependencies without running it.
          sudo mkdir -p /opt/tunnel-switch/.venv/bin
          sudo ln -s /usr/bin/true /opt/tunnel-switch/.venv/bin/tunnel-switch
          systemd-analyze verify --man=no deploy/systemd/tunnel-switch.service

  ssh:
    name: Real SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Test real OpenSSH startup, rotation, failures and cleanup
        run: python -m pytest -q -m ssh_integration
        env:
          TUNNEL_SWITCH_TEST_SSH: '1'
