name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Verify sidebar rendering and refresh
        run: bun --conditions=browser test/verify-tui.ts
      - run: npm run test:coverage
      - name: Normalize plugin LCOV paths to repository root
        run: sed -i 's|^SF:|SF:plugin/|' coverage/lcov.info
      - name: Record plugin coverage revision
        run: git rev-parse HEAD > coverage/coverage-revision.txt
      - name: Upload plugin coverage for SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-coverage
          path: |
            plugin/coverage/lcov.info
            plugin/coverage/coverage-revision.txt
          if-no-files-found: error
          retention-days: 7
