name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - plugin/package.json
      - plugin/package-lock.json
      - .github/workflows/dependency-audit.yml
  # Every PR runs the audit because "Plugin dependency vulnerabilities" is a
  # required status check; a paths filter here leaves PRs that don't touch the
  # lockfile permanently blocked on a check that never registers.
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
