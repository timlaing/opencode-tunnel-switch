name: Dependency audit

on:
  push:
    branches: [main]
  # Every PR runs the audit because "Plugin dependency vulnerabilities" is a
  # required status check; a paths filter here leaves PRs that don't touch the
  # lockfile permanently blocked on a check that never registers.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci --ignore-scripts
      # Report all findings, but only high and critical vulnerabilities block CI.
      - run: npm audit --audit-level=high

  validation-result:
    name: Validate dependency-audit
    needs:
      - plugin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation incomplete: ' + ', '.join(failed))
          PY
