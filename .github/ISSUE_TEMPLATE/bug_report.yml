name: Bug report
description: Report an OpenCode plugin problem. Report server problems in ssh-tunnel-switch.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - OpenCode plugin loading or commands
        - Rate-limit detection or retry
        - Plugin API access or proxy discovery
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Include the repository revision, OS, OpenCode, Node, Bun and external server versions where relevant.
      placeholder: 'OS: ...; OpenCode: ...; server: ...; Node: ...; Bun: ...; revision: ...'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of commands or actions that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant error
      description: Include a short error excerpt. For plugin loading, include its state from the OpenCode plugin API or loader log.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
      description: Include the OpenCode plugin entry and relevant external server version. Replace tokens, credentials, private keys and sensitive hostnames/addresses with placeholders.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing matching issue.
          required: true
        - label: I removed credentials and sensitive deployment information from this report.
          required: true
