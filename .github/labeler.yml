"area: plugin":
  - changed-files:
      - any-glob-to-any-file: ['plugin/index.ts', 'plugin/src/**', 'plugin/package*.json', 'plugin/tsconfig.json']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'LICENSE', 'plugin/LICENSE']
tests:
  - changed-files:
      - any-glob-to-any-file: ['plugin/test/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'plugin/scripts/**']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['plugin/package.json', 'plugin/package-lock.json', '.github/dependabot.yml']
